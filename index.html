<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kivi</title>
<style>
  :root { --bg: #fbfbfd; --fg: #1d1d1f; --fg-2: #6e6e73; --line: #d2d2d7; --accent: #0071e3; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --fg: #f5f5f7; --fg-2: #a1a1a6; --line: #38383a; --accent: #2997ff; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #000; --fg: #f5f5f7; --fg-2: #a1a1a6; --line: #38383a; --accent: #2997ff; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 96px 16px 80px; text-align: center; }
  h1 { font-size: clamp(48px, 12vw, 72px); line-height: 1; margin: 0 0 12px; letter-spacing: -0.04em; }
  p { color: var(--fg-2); margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a { display: block; padding: 14px 18px; border: 1px solid var(--line); border-radius: 14px; color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Kivi</h1>
  <p>Organiza lo que quieras, a tu manera. Todo se guarda en tu iPhone.</p>
  <ul>
    <li><a href="privacidad.html">Política de privacidad · Privacy policy</a></li>
    <li><a href="soporte.html">Soporte · Support</a></li>
  </ul>
</main>
</body>
</html>
